<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 700;
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }
    .badge.online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .metric-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .trust-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .trust-score {
      font-size: 28px;
      font-weight: 800;
      color: #22c55e;
      line-height: 1;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      margin: 8px 0;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 96%;
      background: #22c55e;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: #94a3b8;
    }
    .status-val {
      font-weight: 600;
      color: #e2e8f0;
      text-align: right;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .bio-item {
      background: #182234;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .bio-item .val {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2px;
      font-family: monospace;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover {
      opacity: 0.92;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-drift {
      background: #dc2626;
      color: #fff;
    }
    .btn-reset {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .footer {
      margin-top: 10px;
      font-size: 10.5px;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <img src="icons/icon16.png" style="width: 16px; height: 16px; vertical-align: middle; border-radius: 3px;" alt="Logo" /> ZeroTrust BioSensor
    </div>
    <span id="backendBadge" class="badge offline">Backend Standalone</span>
  </div>

  <div class="metric-card">
    <div class="trust-header">
      <span class="label">Session Trust Level</span>
      <span id="trustScore" class="trust-score">96%</span>
    </div>
    <div class="progress-bar-bg">
      <div id="trustProgress" class="progress-bar-fill"></div>
    </div>
    <div class="status-row">
      <span>Status</span>
      <span id="statusText" class="status-val">Calibrated</span>
    </div>
  </div>

  <div class="metric-card">
    <span class="label">Live Biometric Vector</span>
    <div class="bio-grid">
      <div class="bio-item">
        <div class="label">Mean Dwell</div>
        <div id="dwell" class="val">-- ms</div>
      </div>
      <div class="bio-item">
        <div class="label">Mean Flight</div>
        <div id="flight" class="val">-- ms</div>
      </div>
      <div class="bio-item">
        <div class="label">Mouse Speed</div>
        <div id="velocity" class="val">-- px/s</div>
      </div>
      <div class="bio-item">
        <div class="label">Mouse Jerk</div>
        <div id="jerk" class="val">--</div>
      </div>
    </div>
  </div>

  <div class="btn-group">
    <button id="simulateDriftBtn" class="btn-drift">⚡ Simulate Adversarial Drift (Trigger Lock)</button>
    <button id="resetBaselineBtn" class="btn-reset">↺ Reset Session Baseline</button>
  </div>

  <div class="footer">Continuous Zero-Trust Active • MV3 Privacy Preserving</div>

  <script src="popup.js"></script>
</body>
</html>
